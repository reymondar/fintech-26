name: Publicaciones programadas del CMS
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions: {}
concurrency:
  group: cms-scheduler
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ejecutar publicaciones pendientes
        env:
          CMS_SITE_URL: ${{ secrets.CMS_SITE_URL }}
          CMS_CRON_SECRET: ${{ secrets.CMS_CRON_SECRET }}
        run: |
          if [ -z "$CMS_SITE_URL" ] || [ -z "$CMS_CRON_SECRET" ]; then
            echo "Scheduler pendiente: configurar CMS_SITE_URL y CMS_CRON_SECRET."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $CMS_CRON_SECRET" \
            "${CMS_SITE_URL%/}/api/payload-jobs/run?queue=default"
